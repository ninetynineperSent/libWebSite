{% extends 'base.html' %}

{% block title %}
{{ user_name }}
{% endblock %}

{% block body %}

<style>
    .profile-container {

        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;

    }

    .profile-form {
        display: flex;
        flex-direction: column;
        gap: 15px;
        width: 100%;
        max-width: 400px;
        padding: 20px;
        border: 1px solid #E6CCB2;
        border-radius: 10px;
        background-color: #E6CCB2;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);

    }

    .profile-form label {
        font-size: 14px;
        font-weight: 600;

    }

    .profile-form input {
        box-sizing: border-box;
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 14px;
    }

    .submitBtn {
        padding: 10px 20px;
        border: none;
        border-radius: 5px;
        background-color: #B08968;
        font-size: 16px;
        cursor: pointer;
    }

    .submitBtn:hover {
        background-color: #DDB892;
    }

    .avatar-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-bottom: 20px;
    }

    .avatar-container img {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        object-fit: cover;
        margin-bottom: 10px;
        border: 2px solid #E6CCB2;
    }

    .avatar-container input {
        display: none;
    }

    .avatar-container label {
        background-color: #D19A66;
        color: white;
        padding: 8px 12px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 14px;
    }

    #btnDel {
        padding: 10px 20px;
        border: none;
        border-radius: 5px;
        background-color: rgb(209, 73, 73);
        color: white;
        font-size: 16px;
        cursor: pointer;
    }

    #btnDel:hover {
        background-color: rgb(134, 47, 47);
    }
</style>

<div class="profile-container">
    <h1
        style="font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif">
        Профиль пользователя</h1>
    <form class="profile-form" method="post">

        <div class="avatar-container">
            <img id="avatar-img" src="/avatar/{{ session['user_id'] }}" alt="Аватар пользователя">
            <input type="file" id="avatar" name="avatar">
            <label for="avatar">Изменить аватар</label>
        </div>

        <div>
            <label for="name">Имя</label>
            <input type="text" id="name" name="name" value="{{user_name}}" required>
        </div>

        <div>
            <label for="phone">Номер телефона</label>
            <input type="tel" id="number" name="number" value="{{user_number}}">
        </div>

        <div>
            <label for="telegram">Telegram</label>
            <input type="text" id="telegramm_connect" name="telegramm_connect" value="{{user_telegramm}}">
        </div>

        <button class="submitBtn">Изменить пароль</button>

        <button class="submitBtn" id="btnSave" type="button">Сохранить изменения</button>

        <button type="button" id="btnDel">Удалить аккаунт</button>
    </form>
</div>

<script>
    async function deleteAcc() {
        try {
            const response = await fetch('/profile', {
                method: 'DELETE',
            });
            if (response.status === 500) {
                console.log("Ошибка сервера! Статус 500");
            }
            else if (response.status === 409) {
                const result = await response.json();
                console.log("Не успешно, 409:", result);
            }
            else {
                const result = await response.json();
                console.log('Успешно:', result);
                window.location.href = "/login";
            }
        }
        catch (error) {
            // Выдачи ошибки
            console.error('Ошибка:', error);
        }
    }

    async function btnClickDel() {
        const deleteAccConfirmed = confirm("Вы уверены, что хотите удалить аккаунт?");

        if (deleteAccConfirmed) {
            deleteAcc();
        }
        else {
            console.log("Удаление отменено");
        }
    }

    async function sendData(data) {
        try {
            const response = await fetch('/profile', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });

            if (!response.ok) {
                const result = await response.json();
                console.log("Ошибка:", result);
            } else {
                const result = await response.json();
                console.log('Успешно:', result);
                window.location.reload();
            }
        } catch (error) {
            console.error('Ошибка:', error);
        }
    }


    function validatePhoneNumber(number) {
        const regex = /^\+?[7]([0-9]{10})$/;
        return regex.test(number);
    }

    async function btnClickSave() {
        const name = document.getElementById("name").value.trim();
        const number = document.getElementById("number").value.trim();
        const telegramm_connect = document.getElementById("telegramm_connect").value.trim();


        let is_valid = true;

        if (!validatePhoneNumber(number)) {
            showError(document.getElementById("number"), "Некорректный номер телефона");
            console.log("Некорректный номер телефона");
            is_valid = false;
        }

        if (is_valid) {

            let avatarFile = document.getElementById("avatar");
            let avatarBase64 = null;

            // Используем FileReader для преобразования изображения в Base64
            if (avatarFile.files && avatarFile.files[0]) {
                let file = avatarFile.files[0];

                let reader = new FileReader();

                // Функция, которая срабатывает, когда файл полностью прочитан
                reader.onloadend = function () {
                    avatarBase64 = reader.result; // Получаем Base64

                    const data = {
                        name,
                        number,
                        telegramm_connect,
                        avatar: avatarBase64  // Добавляем изображение в формате Base64
                    };

                    // Лог для проверки данных
                    console.log("Отправляем данные:", data);
                    sendData(data);
                };

                // Читаем файл как DataURL (Base64)
                reader.readAsDataURL(file);
            } else {
                // Если файл не выбран, отправляем null для аватара
                const data = {
                    name,
                    number,
                    telegramm_connect,
                    avatar: avatarBase64  // Будет null, если файл не выбран
                };

                // Лог для проверки данных
                console.log("Отправляем данные (без изображения):", data);
                sendData(data);
            }
        }
    }



    document.getElementById("btnDel").addEventListener("click", btnClickDel)
    document.getElementById("btnSave").addEventListener("click", btnClickSave)
</script>

{% endblock %}
