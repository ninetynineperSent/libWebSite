<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{% endblock %}</title>
</head>

<style>
  body {

    font: 500 14px/20px ALS Sirius, Arial, Helvetica Neue, Helvetica, sans-serif;
    background: #EDE0D4;
    margin: 0;
  }

  .container {
    background: #EDE0D4;
    display: flex;
    height: 100px;
    align-items: center;
    justify-content: center;
    width: 100%;
  }

  .container2 {
    position: fixed;
    width: 100%;
    background-color: #EDE0D4;
    height: 100px;
    align-content: center;
    border-color: black;
    box-shadow: 0 14px 20px rgba(0, 0, 0, 0.1);
  }

  header {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
  }

  .header-container {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    background-color: #E6CCB2;
    padding: 1rem 2rem;
    /* низ потом бока */
    border-radius: 10px;
    width: 70%;
    min-width: 700px;
  }

  .profile-section {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .profile-section-logout {
    justify-content: center;
    gap: 0.5rem;
  }

  .avatar {
    width: 40px;
    height: 40px;
    background-color: #DDB892;
    border-radius: 50%;
  }

  .avatar img {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    object-fit: cover;
  }

  .search-input {
    min-width: 200px;
    width: 100%;
    padding: 0.5rem;
    border: 1px solid #DDB892;
    border-radius: 8px;
    font-size: 16px;
    box-sizing: border-box;
  }

  .search-input:focus {
    border-color: black;
    outline: none;
  }

  .header-link {
    height: 20px;
    text-align: center;
    display: inline-flex;
    align-items: center;
    white-space: nowrap;
    background-color: #B08968;
    color: black;
    text-decoration: none;
    border-radius: 8px;
    padding: 0.5rem 1rem;
    cursor: pointer;
    font-size: 12px;
    transition: background-color 0.3s ease;
  }

  .header-link3 {
    display: flex;
    white-space: nowrap;
    /* background-color: #B08968; */
    color: black;
    text-decoration: none;
    text-align: center;
    /* border-radius: 8px; */
    /* padding: 0.5rem 1rem; */
    font-size: 12px;
    font-weight: 550;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }

  .header-link2 {
    white-space: nowrap;
    /* background-color: #B08968; */
    color: black;
    text-decoration: none;
    display: inline-block;
    text-align: center;
    /* border-radius: 8px; */
    /* padding: 0.5rem 1rem; */
    font-size: 12px;
    font-weight: 550;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }

  .header-link:hover {
    background-color: #DDB892;
  }

  .search-section {
    display: flex;
    align-items: center;
    gap: 0.2rem;
    flex-grow: 1;
  }

  .footer {
    background: #EDE0D4;
    border-radius: 8px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    height: 100px;
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
  }

  .footer-container {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    max-width: 1200px;
    margin: 0 auto;
  }

  .footer-section {
    flex: 1;
    text-align: left;
  }

  .footer-text {
    margin: 0;
    font-size: 14px;
    color: #6D4C41;
  }

  .footer-links {
    flex: 1;
    display: flex;
    justify-content: center;
    gap: 1rem;
  }

  .footer-link {
    text-decoration: none;
    color: #6D4C41;
    font-size: 14px;
    transition: color 0.3s ease;
  }

  .footer-link:hover {
    color: #B08968;
  }

  .footer-social {
    flex: 1;
    display: flex;
    justify-content: flex-end;
    gap: 1rem;
  }

  .footer-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    background-color: #DDB892;
    border-radius: 50%;
    transition: background-color 0.3s ease;
  }

  .footer-icon:hover {
    background-color: #B08968;
  }

  .footer-icon svg {
    fill: #6D4C41;
    width: 20px;
    height: 20px;
  }

  .modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    justify-content: center;
    align-items: center;
  }

  .modal-content {
    background: #EDE0D4;
    padding: 20px;
    border-radius: 8px;
    width: 70%;
    max-height: 80%;
    overflow-y: auto;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
  }

  .modal-content h2 {
    margin-top: 0;
  }

  .close-btn {
    background: #B08968;
    color: #fff;
    border: none;
    padding: 10px 20px;
    border-radius: 5px;
    cursor: pointer;
    display: block;
    margin: 20px auto 0;
    font-size: 16px;
  }

  .close-btn:disabled {
    background: #ccc;
    cursor: not-allowed;
  }

  .footer-link {
    cursor: pointer;
    color: #DDB892;
    text-decoration: underline;
  }
</style>
